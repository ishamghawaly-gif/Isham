name: Find Telegram chat ID
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  find-chat:
    runs-on: ubuntu-latest
    steps:
      - name: Read latest bot updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests, sys
          token=os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              print("ERROR: TELEGRAM_BOT_TOKEN is empty or missing.")
              print("In this repository, open Settings > Secrets and variables > Actions > Repository secrets.")
              print("Create or correct the exact secret name: TELEGRAM_BOT_TOKEN")
              sys.exit(1)
          r=requests.get(f"https://api.telegram.org/bot{token}/getUpdates", timeout=20)
          if not r.ok:
              print("Telegram rejected the token. Check that the BotFather token was copied correctly.")
              print("HTTP status:", r.status_code)
              sys.exit(1)
          updates=r.json().get("result", [])
          found=set()
          for u in updates:
              msg=u.get("message") or u.get("channel_post") or {}
              chat=msg.get("chat", {})
              if chat.get("id") is not None:
                  found.add(str(chat["id"]))
          if not found:
              print("No chat ID found yet. Open your bot in Telegram, press START and send /start, then run this workflow again.")
          for chat_id in sorted(found):
              print("TELEGRAM_CHAT_ID =", chat_id)
          PY
